<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b06f00">
<title>同窓会用 校歌アレンジ プレイリスト</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
  :root{
    --paper:#ffffff;
    --ink:#2b2620;
    --ink-soft:#5b5447;
    --line:#e3d9c4;
    --accent:#2f5f8f;
    --accent-dark:#244b73;
    --accent-light:#e8f1fb;
    --play:#1d7a43;
    --play-dark:#155c32;
    --shadow:0 2px 8px rgba(60,45,15,.10);
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-padding-top:92px; }
  body{
    margin:0;
    min-height:100vh;
    background:
      linear-gradient(180deg,#fcf8ef 0%,var(--accent-light) 100%) fixed;
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
    font-size:18px;
    line-height:1.65;
    padding-bottom:232px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:0 16px; }
  header{
    background:linear-gradient(180deg,#fff9ef,var(--accent-light));
    border-bottom:3px solid var(--accent);
    padding:24px 0 18px;
    text-align:center;
  }
  h1{
    margin:0 0 8px;
    color:var(--accent-dark);
    font-size:28px;
    letter-spacing:.02em;
  }
  .lead{
    margin:0 auto;
    max-width:700px;
    color:var(--ink-soft);
    font-size:16px;
    text-align:left;
  }
  .school-dock{
    position:sticky;
    top:0;
    z-index:30;
    background:rgba(252,248,239,.94);
    border-bottom:2px solid rgba(0,0,0,.06);
    box-shadow:0 5px 16px rgba(60,45,15,.08);
    backdrop-filter:blur(8px);
  }
  .dock-inner{ max-width:900px; margin:0 auto; padding:10px 16px 12px; }
  .school-tabs{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:8px;
  }
  .school-tab{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:52px;
    border:2px solid var(--school-accent,var(--line));
    border-radius:12px;
    background:var(--school-light,var(--paper));
    color:var(--school-dark,var(--ink));
    font-family:inherit;
    font-size:18px;
    font-weight:900;
    padding:9px 8px;
    text-align:center;
    cursor:pointer;
    box-shadow:var(--shadow);
    opacity:.76;
    text-decoration:none;
    transition:transform .08s ease, opacity .12s ease, box-shadow .12s ease;
  }
  .school-tab.active{
    opacity:1;
    box-shadow:0 8px 20px rgba(60,45,15,.12);
    transform:translateY(-1px);
  }
  .school-tab:focus-visible,
  .track-main:focus-visible,
  .player-controls button:focus-visible,
  .mode-btn:focus-visible,
  .mini-btn:focus-visible,
  .pick:focus-within{ outline:4px solid #ffd27a; outline-offset:2px; }

  .playlist-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:14px;
    margin:24px 0 12px;
  }
  .playlist-head h2{
    margin:0;
    color:var(--accent-dark);
    font-size:24px;
  }
  .count{
    color:var(--ink-soft);
    font-size:14px;
    white-space:nowrap;
  }
  .hint{
    margin:0 0 16px;
    color:var(--ink-soft);
    font-size:15px;
  }

  .group{ margin:22px 0 28px; }
  .group-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 10px;
    padding-left:10px;
    border-left:7px solid var(--accent);
    color:var(--accent-dark);
    font-size:20px;
    font-weight:900;
  }
  .school-section .group-title{
    border-left-color:var(--section-accent,var(--accent));
    color:var(--section-dark,var(--accent-dark));
  }
  .track-list{
    display:grid;
    gap:10px;
  }
  .track-card{
    display:grid;
    grid-template-columns:50px minmax(0,1fr);
    gap:10px;
    align-items:stretch;
  }
  .pick{
    position:relative;
    display:grid;
    place-items:center;
    min-height:72px;
    border:2px solid var(--line);
    border-radius:14px;
    background:var(--paper);
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .pick-input{
    position:absolute;
    inset:0;
    margin:0;
    opacity:0;
    cursor:pointer;
  }
  .pick-box{
    width:26px;
    height:26px;
    border:2px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:transparent;
    display:grid;
    place-items:center;
    font-weight:900;
    font-size:18px;
  }
  .track-card.selected .pick{
    border-color:var(--accent);
    background:var(--accent-light);
  }
  .track-card.selected .pick-box{
    border-color:var(--accent);
    background:var(--accent);
    color:#fff;
  }
  .track-main{
    display:grid;
    grid-template-columns:40px minmax(0,1fr) auto;
    gap:10px;
    align-items:center;
    min-height:72px;
    border:2px solid var(--line);
    border-radius:14px;
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
    text-align:left;
    padding:10px 12px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .track-main:hover{ border-color:var(--accent); background:#fffdf7; }
  .track-card.active .track-main{
    border-color:var(--accent);
    background:var(--accent-light);
  }
  .num{
    display:grid;
    place-items:center;
    width:36px;
    height:36px;
    border-radius:12px;
    background:#f5ead6;
    color:var(--accent-dark);
    font-size:15px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
  }
  .track-card.active .num{
    background:var(--accent);
    color:#fff;
  }
  .track-copy{ min-width:0; }
  .school-badge{
    display:inline-flex;
    align-items:center;
    min-height:22px;
    margin-right:7px;
    padding:1px 7px;
    border-radius:999px;
    background:var(--badge-light,#fff3dc);
    color:var(--badge-dark,#8a5600);
    font-size:12px;
    font-weight:900;
    vertical-align:1px;
  }
  .track-title{
    display:block;
    min-width:0;
    font-size:17px;
    font-weight:900;
    line-height:1.32;
    white-space:normal;
  }
  .track-sub{
    display:block;
    min-width:0;
    color:var(--ink-soft);
    font-size:13px;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .duration{
    color:var(--ink-soft);
    font-size:14px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  #player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:50;
    background:#2b2620;
    color:#fff;
    border-top:4px solid var(--accent);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(0,0,0,.25);
  }
  .player-inner{ max-width:900px; margin:0 auto; }
  .player-title{
    margin-bottom:4px;
    text-align:center;
    font-size:16px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .player-meta{
    margin-bottom:10px;
    text-align:center;
    color:#e9e0cf;
    font-size:13px;
  }
  .seek-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .time{
    min-width:46px;
    text-align:center;
    color:#e9e0cf;
    font-size:14px;
    font-variant-numeric:tabular-nums;
  }
  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:10px;
    border-radius:6px;
    background:#5b5447;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--accent);
    border:3px solid #fff;
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--accent);
    border:3px solid #fff;
    cursor:pointer;
  }
  .player-controls{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
    margin-bottom:10px;
  }
  .player-controls button{
    min-height:42px;
    border:0;
    border-radius:12px;
    padding:8px 12px;
    color:#fff;
    background:#4a443a;
    font-family:inherit;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
  }
  .player-controls .play{
    background:var(--play);
    box-shadow:0 2px 0 var(--play-dark);
  }
  .mode-row,
  .selection-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .mode-btn,
  .mini-btn{
    min-height:38px;
    border:2px solid #5b5447;
    border-radius:12px;
    padding:6px 12px;
    background:transparent;
    color:#fff;
    font-family:inherit;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
  }
  .mode-btn.active{
    border-color:var(--accent);
    background:var(--accent-light);
    color:var(--accent-dark);
  }
  .mode-btn:disabled{
    opacity:.45;
    cursor:default;
  }
  .selection-count{
    color:#e9e0cf;
    font-size:14px;
    font-weight:800;
  }
  .volume-row{
    display:flex;
    align-items:center;
    gap:8px;
    max-width:320px;
    margin:0 auto;
  }
  footer{
    padding:28px 16px 10px;
    color:var(--ink-soft);
    font-size:13px;
    text-align:center;
  }

  @media(max-width:520px){
    body{ font-size:17px; padding-bottom:272px; }
    h1{ font-size:24px; }
    .dock-inner{ padding:8px 12px 10px; }
    .school-tabs{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .school-tab{ min-height:48px; font-size:17px; }
    .playlist-head{ align-items:flex-start; flex-direction:column; gap:2px; }
    .track-card{ grid-template-columns:46px minmax(0,1fr); gap:8px; }
    .pick{ min-height:68px; }
    .track-main{
      grid-template-columns:36px minmax(0,1fr) 44px;
      gap:8px;
      min-height:68px;
      padding:9px 10px;
    }
    .num{ width:32px; height:32px; border-radius:10px; font-size:14px; }
    .track-title{ font-size:16px; }
    .duration{ font-size:13px; }
    .player-controls button{ padding:8px 8px; font-size:15px; }
    .mode-btn,.mini-btn{ min-height:36px; padding:6px 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>校歌アレンジ プレイリスト</h1>
    <p class="lead">弥栄中学校・粟田小学校・有済小学校の全曲をまとめた再生専用ページです。下のプレイヤーから順番再生と、チェックした曲だけのランダム再生を切り替えられます。</p>
  </div>
</header>

<div class="school-dock">
  <div class="dock-inner">
    <div class="school-tabs" id="schoolTabs" aria-label="学校切り替え"></div>
  </div>
</div>

<main class="wrap">
  <div class="playlist-head">
    <h2 id="playlistTitle">全曲プレイリスト</h2>
    <div class="count" id="trackCount"></div>
  </div>
  <p class="hint">全曲を一覧で再生できます。チェックを外した曲は、下の「チェック曲ランダム」の対象から外れます。</p>
  <div id="playlist"></div>
</main>

<footer>HINATABOKKURI ／ 同窓会用 校歌アレンジ BGM集</footer>

<div id="player">
  <div class="player-inner">
    <div class="player-title" id="playerTitle">曲を選んでください</div>
    <div class="player-meta" id="playerMeta">順番再生</div>
    <div class="seek-row">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="再生位置">
      <span class="time" id="durTime">0:00</span>
    </div>
    <div class="player-controls">
      <button id="startBtn" type="button">先頭から</button>
      <button class="play" id="playBtn" type="button">▶ 再生</button>
      <button id="nextBtn" type="button">次へ</button>
    </div>
    <div class="mode-row">
      <button class="mode-btn active" id="sequenceBtn" type="button">順番再生</button>
      <button class="mode-btn" id="randomBtn" type="button">チェック曲ランダム</button>
    </div>
    <div class="selection-row">
      <span class="selection-count" id="selectionCount">チェック 0曲</span>
      <button class="mini-btn" id="selectAllBtn" type="button">全選択</button>
      <button class="mini-btn" id="clearSelectionBtn" type="button">解除</button>
    </div>
    <div class="volume-row">
      <span>音量</span>
      <input type="range" id="vol" min="0" max="100" value="90" aria-label="音量">
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>
<script src="../bgm-data.js"></script>
<script>
const { NAV_TABS, SCHOOL_ORDER, SCHOOLS, ARR, GROUPS, BONUS_BY_SCHOOL } = window.DOUSOUKAI_BGM_DATA;
const AUDIO_BASE = '../audio/';
const PLAYLIST_SELECTION_KEY = 'dousoukai_playlist_selected_all';
const schoolTabsEl = document.getElementById('schoolTabs');
const playlistEl = document.getElementById('playlist');
const playlistTitle = document.getElementById('playlistTitle');
const trackCount = document.getElementById('trackCount');
const playerTitle = document.getElementById('playerTitle');
const playerMeta = document.getElementById('playerMeta');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const seek = document.getElementById('seek');
const vol = document.getElementById('vol');
const startBtn = document.getElementById('startBtn');
const playBtn = document.getElementById('playBtn');
const nextBtn = document.getElementById('nextBtn');
const sequenceBtn = document.getElementById('sequenceBtn');
const randomBtn = document.getElementById('randomBtn');
const selectionCount = document.getElementById('selectionCount');
const selectAllBtn = document.getElementById('selectAllBtn');
const clearSelectionBtn = document.getElementById('clearSelectionBtn');
const audio = document.getElementById('audio');
const themeMeta = document.querySelector('meta[name="theme-color"]');

let tracks = [];
let currentIndex = -1;
let seeking = false;
let playMode = 'sequence';
let audioContext = null;
let audioSource = null;
let gainNode = null;
let currentVolume = 0.9;
let selectionSet = null;

const savedVol = localStorage.getItem('dousoukai_vol');
setAppVolume(savedVol !== null ? Number(savedVol) : 0.9);

function fmt(s){
  s = Math.floor(s || 0);
  const m = Math.floor(s / 60);
  const ss = String(s % 60).padStart(2,'0');
  return `${m}:${ss}`;
}
function tabBySchoolId(schoolId){
  return NAV_TABS.find(tab => tab.schoolId === schoolId) || null;
}
function getSchoolTheme(schoolId){
  const theme = SCHOOLS[schoolId] && SCHOOLS[schoolId].theme;
  return theme || { accent:'#b06f00', dark:'#8a5600', light:'#fff3dc', play:'#1d7a43' };
}
function applyPlaylistTheme(){
  const tab = NAV_TABS.find(item => item.id === 'playlist');
  const theme = tab && tab.theme ? tab.theme : { accent:'#2f5f8f', dark:'#244b73', light:'#e8f1fb', play:'#1d7a43' };
  document.documentElement.style.setProperty('--accent', theme.accent);
  document.documentElement.style.setProperty('--accent-dark', theme.dark);
  document.documentElement.style.setProperty('--accent-light', theme.light);
  document.documentElement.style.setProperty('--play', theme.play || theme.accent);
  if(themeMeta) themeMeta.setAttribute('content', theme.accent);
}
function renderTabs(){
  schoolTabsEl.innerHTML = NAV_TABS.map(tab => {
    const theme = tab.theme || (tab.schoolId ? getSchoolTheme(tab.schoolId) : {});
    const style = `--school-accent:${theme.accent || '#e3d9c4'};--school-dark:${theme.dark || '#2b2620'};--school-light:${theme.light || '#ffffff'};`;
    const href = tab.id === 'playlist' ? './' : `../#${tab.hash}`;
    const current = tab.id === 'playlist';
    return `<a class="school-tab${current ? ' active' : ''}" href="${href}" ${current ? 'aria-current="page"' : ''} style="${style}"><span>${tab.label}</span></a>`;
  }).join('');
}
function arrangementKeysForSchool(schoolId){
  const keys = ['chorus'];
  GROUPS.forEach(group => {
    const groupKeys = group.bonus ? (BONUS_BY_SCHOOL[schoolId] || []) : group.items;
    groupKeys.forEach(key => {
      if(!keys.includes(key)) keys.push(key);
    });
  });
  return keys;
}
function buildSchoolTracks(schoolId){
  const result = [];
  arrangementKeysForSchool(schoolId).forEach(key => {
    const d = ARR[key];
    const takes = d.schools && d.schools[schoolId] ? d.schools[schoolId] : [];
    takes.forEach(take => {
      const [label, file, dur] = take;
      result.push({
        schoolId,
        schoolName: SCHOOLS[schoolId].name,
        schoolShort: (tabBySchoolId(schoolId) || {}).label || SCHOOLS[schoolId].name,
        title: d.name,
        label,
        file,
        dur,
        scene: d.scene,
      });
    });
  });
  return result;
}
function buildAllTracks(){
  return SCHOOL_ORDER.flatMap(schoolId => buildSchoolTracks(schoolId));
}
function initSelection(){
  if(selectionSet) return;
  let stored = [];
  try{
    stored = JSON.parse(localStorage.getItem(PLAYLIST_SELECTION_KEY) || '[]');
  }catch(e){
    stored = [];
  }
  const existingFiles = new Set(tracks.map(track => track.file));
  const filtered = Array.isArray(stored) ? stored.filter(file => existingFiles.has(file)) : [];
  selectionSet = filtered.length ? new Set(filtered) : new Set(tracks.map(track => track.file));
  saveSelection();
}
function saveSelection(){
  localStorage.setItem(PLAYLIST_SELECTION_KEY, JSON.stringify([...selectionSet]));
}
function selectedIndices(){
  return tracks.map((track, index) => selectionSet.has(track.file) ? index : -1).filter(index => index >= 0);
}
function renderPlaylist(){
  tracks = buildAllTracks();
  initSelection();
  playlistTitle.textContent = '全曲プレイリスト';
  trackCount.textContent = `${tracks.length}曲`;
  let html = '';
  let index = 0;
  SCHOOL_ORDER.forEach(schoolId => {
    const school = SCHOOLS[schoolId];
    const theme = getSchoolTheme(schoolId);
    const schoolTracks = tracks.filter(track => track.schoolId === schoolId);
    if(!schoolTracks.length) return;
    html += `<section class="group school-section"><h3 class="group-title" style="--section-accent:${theme.accent};--section-dark:${theme.dark};">${school.name}</h3><div class="track-list">`;
    schoolTracks.forEach(track => {
      const isSelected = selectionSet.has(track.file);
      html += `<article class="track-card${isSelected ? ' selected' : ''}" data-index="${index}" data-file="${track.file}">
        <label class="pick" aria-label="${track.schoolName} ${track.title} をランダム対象にする">
          <input class="pick-input" type="checkbox" data-file="${track.file}" ${isSelected ? 'checked' : ''}>
          <span class="pick-box">✓</span>
        </label>
        <button class="track-main" type="button" data-index="${index}">
          <span class="num">${String(index + 1).padStart(2,'0')}</span>
          <span class="track-copy">
            <span class="track-title"><span class="school-badge" style="--badge-light:${theme.light};--badge-dark:${theme.dark};">${track.schoolShort}</span>${track.title} ／ ${track.label}</span>
            <span class="track-sub">${track.schoolName} ・ ${track.scene}</span>
          </span>
          <span class="duration">${fmt(track.dur)}</span>
        </button>
      </article>`;
      index += 1;
    });
    html += '</div></section>';
  });
  playlistEl.innerHTML = html;
  playlistEl.querySelectorAll('.track-main').forEach(btn => {
    btn.addEventListener('click', () => {
      setPlayMode('sequence');
      playTrack(Number(btn.dataset.index));
    });
  });
  playlistEl.querySelectorAll('.pick-input').forEach(input => {
    input.addEventListener('change', () => toggleTrackSelection(input.dataset.file, input.checked));
  });
  updateActiveTrack();
  updateSelectionSummary();
}
function toggleTrackSelection(file, checked){
  if(checked) selectionSet.add(file);
  else selectionSet.delete(file);
  saveSelection();
  const card = playlistEl.querySelector(`.track-card[data-file="${file}"]`);
  if(card) card.classList.toggle('selected', checked);
  updateSelectionSummary();
  updatePlayerMeta();
}
function selectAllTracks(){
  tracks.forEach(track => selectionSet.add(track.file));
  saveSelection();
  renderPlaylist();
  updatePlayerMeta();
}
function clearTrackSelection(){
  selectionSet = new Set();
  saveSelection();
  renderPlaylist();
  updatePlayerMeta();
}
function getAudioContextClass(){
  return window.AudioContext || window.webkitAudioContext;
}
function ensureAudioRouting(){
  if(gainNode){
    if(audioContext && audioContext.state === 'suspended') audioContext.resume().catch(()=>{});
    return;
  }
  const AudioContextClass = getAudioContextClass();
  if(!AudioContextClass) return;
  try{
    audioContext = new AudioContextClass();
    audioSource = audioContext.createMediaElementSource(audio);
    gainNode = audioContext.createGain();
    gainNode.gain.value = currentVolume;
    audioSource.connect(gainNode).connect(audioContext.destination);
    if(audioContext.state === 'suspended') audioContext.resume().catch(()=>{});
  }catch(e){
    audioContext = null;
    audioSource = null;
    gainNode = null;
  }
}
function setAppVolume(value){
  const normalized = Math.max(0, Math.min(1, Number(value) || 0));
  currentVolume = normalized;
  try{ audio.volume = normalized; }catch(e){}
  if(gainNode) gainNode.gain.value = normalized;
  vol.value = Math.round(normalized * 100);
}
function setPlayMode(mode){
  playMode = mode;
  sequenceBtn.classList.toggle('active', mode === 'sequence');
  randomBtn.classList.toggle('active', mode === 'random');
  startBtn.textContent = mode === 'random' ? 'ランダム開始' : '先頭から';
  updatePlayerMeta();
}
function updateSelectionSummary(){
  const count = selectedIndices().length;
  selectionCount.textContent = `チェック ${count}曲`;
  randomBtn.disabled = count === 0;
  if(count === 0 && playMode === 'random'){
    setPlayMode('sequence');
  }
}
function updatePlayerMeta(){
  const selectedCount = selectedIndices().length;
  const modeLabel = playMode === 'random' ? 'チェック曲ランダム' : '順番再生';
  playerMeta.textContent = `全曲プレイリスト ｜ ${modeLabel} ｜ チェック ${selectedCount}曲`;
}
function playTrack(index){
  if(index < 0 || index >= tracks.length) return;
  currentIndex = index;
  const track = tracks[index];
  audio.src = AUDIO_BASE + track.file;
  playerTitle.textContent = `${track.schoolName} ｜ ${track.title} ｜ ${track.label}`;
  updateActiveTrack();
  updatePlayerMeta();
  ensureAudioRouting();
  const result = audio.play();
  if(result && typeof result.catch === 'function') result.catch(()=>{});
}
function nextSequentialIndex(){
  if(!tracks.length) return -1;
  if(currentIndex < 0) return 0;
  return currentIndex + 1 < tracks.length ? currentIndex + 1 : -1;
}
function randomIndex(excludeCurrent=true){
  const pool = selectedIndices();
  if(!pool.length) return -1;
  if(excludeCurrent && pool.length > 1){
    const filtered = pool.filter(index => index !== currentIndex);
    if(filtered.length) return filtered[Math.floor(Math.random() * filtered.length)];
  }
  return pool[Math.floor(Math.random() * pool.length)];
}
function startCurrentMode(){
  if(playMode === 'random'){
    const index = randomIndex(false);
    if(index >= 0) playTrack(index);
    return;
  }
  if(tracks.length) playTrack(0);
}
function playNext(){
  if(playMode === 'random'){
    const index = randomIndex(true);
    if(index >= 0) playTrack(index);
    return;
  }
  const index = nextSequentialIndex();
  if(index >= 0) playTrack(index);
}
function resetPlayer(){
  playerTitle.textContent = '曲を選んでください';
  curTime.textContent = '0:00';
  durTime.textContent = '0:00';
  seek.value = 0;
  playBtn.textContent = '▶ 再生';
  updatePlayerMeta();
  updateActiveTrack();
}
function updateActiveTrack(){
  document.querySelectorAll('.track-card').forEach(card => {
    card.classList.toggle('active', Number(card.dataset.index) === currentIndex);
  });
}
function updatePlayState(){
  playBtn.textContent = audio.paused ? '▶ 再生' : '⏸ 一時停止';
}

applyPlaylistTheme();
renderTabs();
renderPlaylist();
setPlayMode('sequence');
resetPlayer();

startBtn.addEventListener('click', () => startCurrentMode());
playBtn.addEventListener('click', () => {
  if(currentIndex < 0){
    startCurrentMode();
    return;
  }
  if(audio.paused){
    ensureAudioRouting();
    audio.play().catch(()=>{});
  }else{
    audio.pause();
  }
});
nextBtn.addEventListener('click', () => playNext());
sequenceBtn.addEventListener('click', () => setPlayMode('sequence'));
randomBtn.addEventListener('click', () => {
  if(randomBtn.disabled) return;
  setPlayMode('random');
  startCurrentMode();
});
selectAllBtn.addEventListener('click', () => selectAllTracks());
clearSelectionBtn.addEventListener('click', () => clearTrackSelection());

audio.addEventListener('play', updatePlayState);
audio.addEventListener('pause', updatePlayState);
audio.addEventListener('ended', () => {
  updatePlayState();
  if(playMode === 'random'){
    const index = randomIndex(true);
    if(index >= 0) playTrack(index);
    return;
  }
  const index = nextSequentialIndex();
  if(index >= 0) playTrack(index);
});
audio.addEventListener('loadedmetadata', () => {
  durTime.textContent = fmt(audio.duration);
});
audio.addEventListener('timeupdate', () => {
  if(seeking) return;
  curTime.textContent = fmt(audio.currentTime);
  if(audio.duration) seek.value = Math.round(audio.currentTime / audio.duration * 1000);
});
seek.addEventListener('input', () => {
  seeking = true;
  if(audio.duration) curTime.textContent = fmt(seek.value / 1000 * audio.duration);
});
seek.addEventListener('change', () => {
  if(audio.duration) audio.currentTime = seek.value / 1000 * audio.duration;
  seeking = false;
});
vol.addEventListener('pointerdown', ensureAudioRouting);
vol.addEventListener('touchstart', ensureAudioRouting, { passive:true });
vol.addEventListener('input', () => {
  setAppVolume(vol.value / 100);
  localStorage.setItem('dousoukai_vol', currentVolume);
});
vol.addEventListener('change', () => {
  setAppVolume(vol.value / 100);
  localStorage.setItem('dousoukai_vol', currentVolume);
});
</script>
</body>
</html>
