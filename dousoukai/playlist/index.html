<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5f8f">
<title>同窓会用 校歌アレンジ 全曲再生</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
  :root{
    --paper:#ffffff;
    --ink:#2b2620;
    --ink-soft:#5b5447;
    --line:#e3d9c4;
    --accent:#2f5f8f;
    --accent-dark:#244b73;
    --accent-light:#e8f1fb;
    --accent-bg:#eef4fb;
    --play:#1d7a43;
    --play-dark:#155c32;
    --shadow:0 2px 8px rgba(60,45,15,.10);
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-padding-top:164px; }
  body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg,#fcf8ef 0%,var(--accent-bg) 100%) fixed;
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
    font-size:18px;
    line-height:1.65;
    padding-bottom:224px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:0 16px; }
  header{
    background:linear-gradient(180deg,#fff9ef,var(--accent-light));
    border-bottom:3px solid var(--accent);
    padding:24px 0 18px;
    text-align:center;
  }
  h1{
    margin:0 0 8px;
    color:var(--accent-dark);
    font-size:28px;
    letter-spacing:.02em;
  }
  .lead{
    margin:0 auto;
    max-width:700px;
    color:var(--ink-soft);
    font-size:16px;
    text-align:left;
  }

  .school-dock{
    position:sticky;
    top:0;
    z-index:30;
    background:rgba(252,248,239,.94);
    border-bottom:2px solid rgba(0,0,0,.06);
    box-shadow:0 5px 16px rgba(60,45,15,.08);
    backdrop-filter:blur(8px);
  }
  .dock-inner{ max-width:900px; margin:0 auto; padding:10px 16px 12px; }
  .playlist-cta{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:60px;
    margin-bottom:10px;
    border:2px solid var(--accent);
    border-radius:16px;
    background:#f3f8ff;
    color:var(--accent-dark);
    text-decoration:none;
    font-size:22px;
    font-weight:900;
    box-shadow:var(--shadow);
  }
  .playlist-cta.is-current{
    background:var(--accent);
    color:#fff;
    box-shadow:0 8px 20px rgba(36,75,115,.18);
  }
  .playlist-cta:focus-visible,
  .school-tab:focus-visible,
  .track-main:focus-visible,
  .player-actions button:focus-visible,
  .pick:focus-within{
    outline:4px solid #ffd27a;
    outline-offset:2px;
  }
  .school-tabs{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
  }
  .school-tab{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:52px;
    border:2px solid var(--school-accent,var(--line));
    border-radius:12px;
    background:var(--school-light,var(--paper));
    color:var(--school-dark,var(--ink));
    font-family:inherit;
    font-size:18px;
    font-weight:900;
    padding:9px 8px;
    text-align:center;
    text-decoration:none;
    box-shadow:var(--shadow);
    opacity:.86;
  }
  .school-tab:hover{ opacity:1; transform:translateY(-1px); }

  .playlist-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:14px;
    margin:24px 0 12px;
  }
  .playlist-head h2{
    margin:0;
    color:var(--accent-dark);
    font-size:24px;
  }
  .count{
    color:var(--ink-soft);
    font-size:14px;
    white-space:nowrap;
  }
  .hint{
    margin:0 0 16px;
    color:var(--ink-soft);
    font-size:15px;
  }

  .group{ margin:22px 0 28px; }
  .group-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 10px;
    padding-left:10px;
    border-left:7px solid var(--accent);
    color:var(--accent-dark);
    font-size:20px;
    font-weight:900;
  }
  .school-section .group-title{
    border-left-color:var(--section-accent,var(--accent));
    color:var(--section-dark,var(--accent-dark));
  }
  .track-list{
    display:grid;
    gap:10px;
  }
  .track-card{
    display:grid;
    grid-template-columns:50px minmax(0,1fr);
    gap:10px;
    align-items:stretch;
  }
  .pick{
    position:relative;
    display:grid;
    place-items:center;
    min-height:72px;
    border:2px solid var(--line);
    border-radius:14px;
    background:var(--paper);
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .pick-input{
    position:absolute;
    inset:0;
    margin:0;
    opacity:0;
    cursor:pointer;
  }
  .pick-box{
    width:26px;
    height:26px;
    border:2px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:transparent;
    display:grid;
    place-items:center;
    font-weight:900;
    font-size:18px;
  }
  .track-card.selected .pick{
    border-color:var(--accent);
    background:var(--accent-light);
  }
  .track-card.selected .pick-box{
    border-color:var(--accent);
    background:var(--accent);
    color:#fff;
  }
  .track-main{
    display:grid;
    grid-template-columns:40px minmax(0,1fr) auto;
    gap:10px;
    align-items:center;
    min-height:72px;
    border:2px solid var(--line);
    border-radius:14px;
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
    text-align:left;
    padding:10px 12px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .track-main:hover{ border-color:var(--accent); background:#fffdf7; }
  .track-card.active .track-main{
    border-color:var(--accent);
    background:var(--accent-light);
  }
  .num{
    display:grid;
    place-items:center;
    width:36px;
    height:36px;
    border-radius:12px;
    background:#f5ead6;
    color:var(--accent-dark);
    font-size:15px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
  }
  .track-card.active .num{
    background:var(--accent);
    color:#fff;
  }
  .track-copy{ min-width:0; }
  .school-badge{
    display:inline-flex;
    align-items:center;
    min-height:22px;
    margin-right:7px;
    padding:1px 7px;
    border-radius:999px;
    background:var(--badge-light,#fff3dc);
    color:var(--badge-dark,#8a5600);
    font-size:12px;
    font-weight:900;
    vertical-align:1px;
  }
  .track-title{
    display:block;
    min-width:0;
    font-size:17px;
    font-weight:900;
    line-height:1.32;
  }
  .track-sub{
    display:block;
    min-width:0;
    color:var(--ink-soft);
    font-size:13px;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .duration{
    color:var(--ink-soft);
    font-size:14px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  #player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:50;
    background:rgba(35,31,26,.96);
    color:#fff;
    border-top:4px solid var(--accent);
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(0,0,0,.25);
    backdrop-filter:blur(10px);
  }
  .player-inner{ max-width:900px; margin:0 auto; }
  .player-title{
    margin-bottom:4px;
    text-align:center;
    font-size:16px;
    font-weight:900;
    line-height:1.35;
    min-height:44px;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    white-space:normal;
    overflow:hidden;
  }
  .player-meta{
    margin-bottom:10px;
    text-align:center;
    color:#e9e0cf;
    font-size:13px;
  }
  .seek-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .time{
    min-width:46px;
    text-align:center;
    color:#e9e0cf;
    font-size:14px;
    font-variant-numeric:tabular-nums;
  }
  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height:10px;
    border-radius:6px;
    background:#5b5447;
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--accent);
    border:3px solid #fff;
    cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--accent);
    border:3px solid #fff;
    cursor:pointer;
  }
  .player-actions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }
  .player-actions button{
    min-height:44px;
    border:0;
    border-radius:12px;
    padding:8px 12px;
    color:#fff;
    background:#4a443a;
    font-family:inherit;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
  }
  .player-actions button:disabled{
    opacity:.45;
    cursor:default;
  }
  .play-btn{
    background:var(--play);
    box-shadow:0 2px 0 var(--play-dark);
  }
  .random-btn{
    grid-column:1 / -1;
    background:transparent;
    border:2px solid #7c8ea8;
  }
  .random-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    box-shadow:0 6px 16px rgba(36,75,115,.22);
  }

  footer{
    padding:28px 16px 10px;
    color:var(--ink-soft);
    font-size:13px;
    text-align:center;
  }

  @media(max-width:520px){
    body{ font-size:17px; padding-bottom:244px; }
    h1{ font-size:24px; }
    .dock-inner{ padding:8px 12px 10px; }
    .playlist-cta{ min-height:56px; font-size:20px; }
    .school-tab{ min-height:48px; font-size:17px; }
    .playlist-head{ align-items:flex-start; flex-direction:column; gap:2px; }
    .track-card{ grid-template-columns:46px minmax(0,1fr); gap:8px; }
    .pick{ min-height:68px; }
    .track-main{
      grid-template-columns:36px minmax(0,1fr) 44px;
      gap:8px;
      min-height:68px;
      padding:9px 10px;
    }
    .num{ width:32px; height:32px; border-radius:10px; font-size:14px; }
    .track-title{ font-size:16px; }
    .duration{ font-size:13px; }
    .player-actions button{ padding:8px 8px; font-size:15px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>全曲再生プレイリスト</h1>
    <p class="lead">弥栄中学校・粟田小学校・有済小学校の曲をまとめた再生専用ページです。聴きたい曲はそのまま押して再生、左のチェックを入れた曲だけをランダム再生できます。</p>
  </div>
</header>

<div class="school-dock">
  <div class="dock-inner">
    <a class="playlist-cta is-current" href="./" aria-current="page">全曲再生</a>
    <div class="school-tabs" id="schoolTabs" aria-label="学校切り替え"></div>
  </div>
</div>

<main class="wrap">
  <div class="playlist-head">
    <h2 id="playlistTitle">全曲プレイリスト</h2>
    <div class="count" id="trackCount"></div>
  </div>
  <p class="hint">左のチェックが入っている曲だけが「チェック曲ランダム」の対象になります。チェック状態は次回もそのまま残ります。</p>
  <div id="playlist"></div>
</main>

<footer>HINATABOKKURI ／ 同窓会用 校歌アレンジ BGM集</footer>

<div id="player" aria-live="polite">
  <div class="player-inner">
    <div class="player-title" id="playerTitle">曲を選ぶか、ランダム再生を押してください</div>
    <div class="player-meta" id="playerMeta">個別再生 ｜ ランダム対象 0曲</div>
    <div class="seek-row">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="再生位置">
      <span class="time" id="durTime">0:00</span>
    </div>
    <div class="player-actions">
      <button class="play-btn" id="playBtn" type="button">▶ 再生</button>
      <button id="restartBtn" type="button">↺ 最初から</button>
      <button class="random-btn" id="randomBtn" type="button" aria-pressed="false">🎲 チェック曲ランダム</button>
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>
<script src="../bgm-data.js"></script>
<script>
const { NAV_TABS, SCHOOL_ORDER, SCHOOLS, ARR, GROUPS, BONUS_BY_SCHOOL } = window.DOUSOUKAI_BGM_DATA;
const AUDIO_BASE = '../audio/';
const PLAYLIST_SELECTION_KEY = 'dousoukai_playlist_selected_all';
const PLAYLIST_THEME = NAV_TABS.find(tab => tab.id === 'playlist')?.theme || { accent:'#2f5f8f', dark:'#244b73', light:'#e8f1fb', bg:'#eef4fb', play:'#1d7a43' };
const themeMeta = document.querySelector('meta[name="theme-color"]');
const schoolTabsEl = document.getElementById('schoolTabs');
const playlistEl = document.getElementById('playlist');
const playlistTitle = document.getElementById('playlistTitle');
const trackCount = document.getElementById('trackCount');
const playerTitle = document.getElementById('playerTitle');
const playerMeta = document.getElementById('playerMeta');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const seek = document.getElementById('seek');
const playBtn = document.getElementById('playBtn');
const restartBtn = document.getElementById('restartBtn');
const randomBtn = document.getElementById('randomBtn');
const audio = document.getElementById('audio');

let tracks = [];
let currentIndex = -1;
let seeking = false;
let randomMode = false;
let selectionSet = null;

function fmt(s){
  s = Math.floor(s || 0);
  const m = Math.floor(s / 60);
  const ss = String(s % 60).padStart(2,'0');
  return `${m}:${ss}`;
}
function tabBySchoolId(schoolId){
  return NAV_TABS.find(tab => tab.schoolId === schoolId) || null;
}
function getSchoolTheme(schoolId){
  const theme = SCHOOLS[schoolId] && SCHOOLS[schoolId].theme;
  return theme || { accent:'#b06f00', dark:'#8a5600', light:'#fff3dc', bg:'#faf5ea', play:'#1d7a43' };
}
function applyPlaylistTheme(){
  document.documentElement.style.setProperty('--accent', PLAYLIST_THEME.accent || '#2f5f8f');
  document.documentElement.style.setProperty('--accent-dark', PLAYLIST_THEME.dark || '#244b73');
  document.documentElement.style.setProperty('--accent-light', PLAYLIST_THEME.light || '#e8f1fb');
  document.documentElement.style.setProperty('--accent-bg', PLAYLIST_THEME.bg || '#eef4fb');
  document.documentElement.style.setProperty('--play', PLAYLIST_THEME.play || '#1d7a43');
  if(themeMeta) themeMeta.setAttribute('content', PLAYLIST_THEME.accent || '#2f5f8f');
}
function renderTabs(){
  schoolTabsEl.innerHTML = SCHOOL_ORDER.map(schoolId => {
    const tab = tabBySchoolId(schoolId);
    const theme = getSchoolTheme(schoolId);
    const style = `--school-accent:${theme.accent || '#e3d9c4'};--school-dark:${theme.dark || '#2b2620'};--school-light:${theme.light || '#ffffff'};`;
    return `<a class="school-tab" href="../#${tab ? tab.hash : schoolId}" style="${style}"><span>${tab ? tab.label : SCHOOLS[schoolId].name}</span></a>`;
  }).join('');
}
function arrangementKeysForSchool(schoolId){
  const keys = ['chorus'];
  GROUPS.forEach(group => {
    const groupKeys = group.bonus ? (BONUS_BY_SCHOOL[schoolId] || []) : group.items;
    groupKeys.forEach(key => {
      if(!keys.includes(key)) keys.push(key);
    });
  });
  return keys;
}
function buildSchoolTracks(schoolId){
  const result = [];
  arrangementKeysForSchool(schoolId).forEach(key => {
    const d = ARR[key];
    const takes = d.schools && d.schools[schoolId] ? d.schools[schoolId] : [];
    takes.forEach(take => {
      const [label, file, dur] = take;
      result.push({
        schoolId,
        schoolName: SCHOOLS[schoolId].name,
        schoolShort: (tabBySchoolId(schoolId) || {}).label || SCHOOLS[schoolId].name,
        title: d.name,
        label,
        file,
        dur,
        scene: d.scene,
      });
    });
  });
  return result;
}
function buildAllTracks(){
  return SCHOOL_ORDER.flatMap(schoolId => buildSchoolTracks(schoolId));
}
function initSelection(){
  if(selectionSet) return;
  let stored = [];
  try{
    stored = JSON.parse(localStorage.getItem(PLAYLIST_SELECTION_KEY) || '[]');
  }catch(e){
    stored = [];
  }
  const existingFiles = new Set(tracks.map(track => track.file));
  const filtered = Array.isArray(stored) ? stored.filter(file => existingFiles.has(file)) : [];
  selectionSet = filtered.length ? new Set(filtered) : new Set(tracks.map(track => track.file));
  saveSelection();
}
function saveSelection(){
  localStorage.setItem(PLAYLIST_SELECTION_KEY, JSON.stringify([...selectionSet]));
}
function selectedIndices(){
  return tracks.map((track, index) => selectionSet.has(track.file) ? index : -1).filter(index => index >= 0);
}
function renderPlaylist(){
  playlistTitle.textContent = '全曲プレイリスト';
  let html = '';
  let index = 0;
  SCHOOL_ORDER.forEach(schoolId => {
    const school = SCHOOLS[schoolId];
    const theme = getSchoolTheme(schoolId);
    const schoolTracks = tracks.filter(track => track.schoolId === schoolId);
    if(!schoolTracks.length) return;
    html += `<section class="group school-section"><h3 class="group-title" style="--section-accent:${theme.accent};--section-dark:${theme.dark};">${school.name}</h3><div class="track-list">`;
    schoolTracks.forEach(track => {
      const isSelected = selectionSet.has(track.file);
      html += `<article class="track-card${isSelected ? ' selected' : ''}" data-index="${index}" data-file="${track.file}">
        <label class="pick" aria-label="${track.schoolName} ${track.title} をランダム対象にする">
          <input class="pick-input" type="checkbox" data-file="${track.file}" ${isSelected ? 'checked' : ''}>
          <span class="pick-box">✓</span>
        </label>
        <button class="track-main" type="button" data-index="${index}">
          <span class="num">${String(index + 1).padStart(2,'0')}</span>
          <span class="track-copy">
            <span class="track-title"><span class="school-badge" style="--badge-light:${theme.light};--badge-dark:${theme.dark};">${track.schoolShort}</span>${track.title} ／ ${track.label}</span>
            <span class="track-sub">${track.schoolName} ・ ${track.scene}</span>
          </span>
          <span class="duration">${fmt(track.dur)}</span>
        </button>
      </article>`;
      index += 1;
    });
    html += '</div></section>';
  });
  playlistEl.innerHTML = html;
  playlistEl.querySelectorAll('.track-main').forEach(btn => {
    btn.addEventListener('click', () => {
      playTrack(Number(btn.dataset.index));
    });
  });
  playlistEl.querySelectorAll('.pick-input').forEach(input => {
    input.addEventListener('change', () => toggleTrackSelection(input.dataset.file, input.checked));
  });
  updateActiveTrack();
  updateSelectionSummary();
}
function toggleTrackSelection(file, checked){
  if(checked) selectionSet.add(file);
  else selectionSet.delete(file);
  saveSelection();
  const card = playlistEl.querySelector(`.track-card[data-file="${file}"]`);
  if(card) card.classList.toggle('selected', checked);
  updateSelectionSummary();
}
function setRandomMode(on){
  randomMode = Boolean(on) && selectedIndices().length > 0;
  randomBtn.classList.toggle('active', randomMode);
  randomBtn.setAttribute('aria-pressed', randomMode);
  updatePlayerMeta();
}
function updateSelectionSummary(){
  const selectedCount = selectedIndices().length;
  trackCount.textContent = `全${tracks.length}曲 / ランダム対象 ${selectedCount}曲`;
  randomBtn.disabled = selectedCount === 0;
  if(selectedCount === 0 && randomMode){
    setRandomMode(false);
  }else{
    updatePlayerMeta();
  }
}
function updatePlayerMeta(){
  const selectedCount = selectedIndices().length;
  const modeLabel = randomMode ? 'チェック曲ランダム再生中' : '個別再生';
  playerMeta.textContent = `${modeLabel} ｜ ランダム対象 ${selectedCount}曲`;
}
function updatePlayerButtons(){
  const hasTrack = currentIndex >= 0;
  playBtn.disabled = !hasTrack;
  restartBtn.disabled = !hasTrack;
  playBtn.textContent = hasTrack && !audio.paused ? '⏸ 一時停止' : '▶ 再生';
}
function updateActiveTrack(){
  document.querySelectorAll('.track-card').forEach(card => {
    card.classList.toggle('active', Number(card.dataset.index) === currentIndex);
  });
}
function playTrack(index, options = {}){
  if(index < 0 || index >= tracks.length) return;
  const keepRandom = Boolean(options.keepRandom);
  if(!keepRandom) setRandomMode(false);
  currentIndex = index;
  const track = tracks[index];
  const src = AUDIO_BASE + track.file;
  playerTitle.textContent = `${track.schoolName} ｜ ${track.title} ｜ ${track.label}`;
  curTime.textContent = '0:00';
  durTime.textContent = fmt(track.dur);
  seek.value = 0;
  updateActiveTrack();
  updatePlayerMeta();
  updatePlayerButtons();
  if(audio.src.endsWith('/' + track.file) || audio.src.endsWith(track.file)){
    audio.currentTime = 0;
  }else{
    audio.src = src;
  }
  const result = audio.play();
  if(result && typeof result.catch === 'function') result.catch(() => updatePlayerButtons());
}
function randomIndex(excludeCurrent = true){
  const pool = selectedIndices();
  if(!pool.length) return -1;
  if(excludeCurrent && pool.length > 1){
    const filtered = pool.filter(index => index !== currentIndex);
    if(filtered.length) return filtered[Math.floor(Math.random() * filtered.length)];
  }
  return pool[Math.floor(Math.random() * pool.length)];
}
function startRandomPlayback(){
  const index = randomIndex(currentIndex >= 0);
  if(index < 0) return;
  setRandomMode(true);
  playTrack(index, { keepRandom:true });
}
function resetCurrentTrack(){
  if(currentIndex < 0 || !audio.src) return;
  audio.currentTime = 0;
  const result = audio.play();
  if(result && typeof result.catch === 'function') result.catch(() => updatePlayerButtons());
}
function resetPlayer(){
  playerTitle.textContent = '曲を選ぶか、ランダム再生を押してください';
  curTime.textContent = '0:00';
  durTime.textContent = '0:00';
  seek.value = 0;
  updatePlayerMeta();
  updatePlayerButtons();
  updateActiveTrack();
}

applyPlaylistTheme();
renderTabs();
tracks = buildAllTracks();
initSelection();
renderPlaylist();
resetPlayer();

playBtn.addEventListener('click', () => {
  if(currentIndex < 0 || !audio.src) return;
  if(audio.paused){
    audio.play().catch(() => updatePlayerButtons());
  }else{
    audio.pause();
  }
});
restartBtn.addEventListener('click', () => resetCurrentTrack());
randomBtn.addEventListener('click', () => {
  if(randomBtn.disabled) return;
  startRandomPlayback();
});

audio.addEventListener('play', updatePlayerButtons);
audio.addEventListener('pause', updatePlayerButtons);
audio.addEventListener('ended', () => {
  updatePlayerButtons();
  if(randomMode) startRandomPlayback();
});
audio.addEventListener('loadedmetadata', () => {
  durTime.textContent = fmt(audio.duration || (currentIndex >= 0 ? tracks[currentIndex].dur : 0));
});
audio.addEventListener('timeupdate', () => {
  if(seeking) return;
  curTime.textContent = fmt(audio.currentTime);
  if(audio.duration) seek.value = Math.round(audio.currentTime / audio.duration * 1000);
});
seek.addEventListener('input', () => {
  seeking = true;
  if(audio.duration) curTime.textContent = fmt(seek.value / 1000 * audio.duration);
});
seek.addEventListener('change', () => {
  if(audio.duration) audio.currentTime = seek.value / 1000 * audio.duration;
  seeking = false;
});
</script>
</body>
</html>
